name: backfill

# Rebuild historical release artifacts that were lost when the repository was
# recreated. Manual only: nothing here runs on push.
#
#   - Docker: build the image from the tag's `app/` tree and push it with the
#     tag's own name (linux/amd64 + linux/arm64).
#   - Assets: build `mix2api-<version>-deploy.zip` (portable, Windows runtime),
#     `mix2api-<version>-source.zip`, and SHA256SUMS, then attach them to the
#     existing GitHub Release.
#
# Tags whose source still reports the upstream version (v1.0.x predates the
# mix2api version bump and says wb-proxy/1.9.2) are skipped by the asset job
# with a clear message; their releases keep the notes only.
on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Space-separated tags to rebuild"
        required: true
        default: "v1.2.0 v1.4.0"
      build_images:
        description: "Rebuild and push Docker images"
        type: boolean
        default: true
      build_assets:
        description: "Build ZIPs/SHA256SUMS and attach them to the releases"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare tag matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          tags = os.environ["TAGS"].split()
          if not tags:
              raise SystemExit("no tags given")
          print("matrix=" + json.dumps({"tag": tags}))
          PY

  image:
    name: image ${{ matrix.tag }}
    if: ${{ inputs.build_images }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ matrix.tag }}
          labels: |
            org.opencontainers.image.title=mix2api
            org.opencontainers.image.description=Single-process OpenAI-compatible gateway for WorkBuddy (intl/CN) and Huawei Cloud CodeArts
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  assets:
    name: assets ${{ matrix.tag }}
    if: ${{ inputs.build_assets }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide asset format
        id: version
        working-directory: app
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SRC=$(grep -oP 'server_version\s*=\s*"(?:mix2api|wb-proxy)/\K[^"]+' wb_proxy.py | head -n1)
          MODE=$(python -c "import sys; v=tuple(int(x) for x in sys.argv[1].split('.')); print('portable' if v >= (1,2,0) else 'source')" "$VERSION")
          echo "tag=$TAG version=$VERSION source=$SRC mode=$MODE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      # v1.0.x - v1.1.x shipped a plain source bundle as the deploy ZIP; the
      # portable runtime package (and a separate source ZIP) starts at v1.2.0.
      - name: Build source-bundle deploy ZIP (pre-1.2.0)
        if: ${{ steps.version.outputs.mode == 'source' }}
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix="mix2api-$VERSION/" \
            -o "dist/mix2api-$VERSION-deploy.zip" HEAD \
            app deploy docs README.md LICENSE UPSTREAM.md Makefile
          ls -lh dist

      - name: Build portable deploy ZIP (1.2.0+)
        if: ${{ steps.version.outputs.mode == 'portable' }}
        working-directory: app
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          URL=$(python -c "import sys; sys.path.insert(0,'release'); import portable_runtime as r; print(r.RUNTIME_URL)")
          SHA=$(python -c "import sys; sys.path.insert(0,'release'); import portable_runtime as r; print(r.RUNTIME_SHA256)")
          curl -fsSL --retry 3 -o /tmp/runtime.tar.gz "$URL"
          echo "$SHA  /tmp/runtime.tar.gz" | sha256sum -c -
          python release/portable_runtime.py prepare --tarball /tmp/runtime.tar.gz --dest python
          mkdir -p ../dist
          python release/release_tools.py portable \
            --version "$VERSION" --tag "$TAG" \
            --out "../dist/mix2api-$VERSION-deploy.zip" --runtime python
          ls -lh ../dist

      - name: Build source ZIP and checksums
        env:
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          git archive --format=zip --prefix="mix2api-$VERSION/" \
            -o "dist/mix2api-$VERSION-source.zip" HEAD
          python3 app/release/release_tools.py checksums --out dist/SHA256SUMS dist/*.zip
          ls -lh dist

      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name'
