# mix2api 单进程 compose（app/ 目录内直接构建）
# 推荐从仓库根目录使用：cd deploy && docker compose up -d --build
services:
  wb-proxy:
    build: .
    image: mix2api:local
    container_name: mix2api
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "58675:58675"
    environment:
      - HOST=0.0.0.0
      - PORT=58675
      - TZ=Asia/Shanghai
    volumes:
      - ./accounts:/app/accounts
      - ./usage:/app/usage
